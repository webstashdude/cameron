<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%"
     height="100%"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <style>
      <![CDATA[
        html, body {
          margin: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: Arial, Helvetica, sans-serif;
          background: #000;
        }

        * {
          box-sizing: border-box;
        }

        .page {
          width: 100vw;
          height: 100vh;
          position: relative;
          overflow: hidden;

          background:
            linear-gradient(
              rgba(0,0,0,0.18),
              rgba(0,0,0,0.18)
            ),
            url("https://cdn.jsdelivr.net/gh/webstashdude/cameron@latest/cameron.jpg")
            center center / cover no-repeat;

          opacity: 0;
          animation: pageFade 1.2s ease-out forwards;
        }

        @keyframes pageFade {
          from {
            opacity: 0;
          }

          to {
            opacity: 1;
          }
        }

        .topbar {
          position: absolute;
          top: 0;
          left: 0;

          width: 100%;
          height: clamp(42px, 5vh, 58px);

          display: flex;
          align-items: center;

          padding: 0 clamp(14px, 2vw, 30px);

          background: rgba(0,0,0,0.72);
          border-bottom: 1px solid rgba(255,255,255,0.12);

          color: white;
          font-size: clamp(17px, 1.5vw, 24px);
          font-weight: 700;

          letter-spacing: 0.3px;

          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
        }

        .buttons {
          position: absolute;

          bottom: clamp(16px, 3vh, 32px);
          left: 50%;

          transform: translateX(-50%);

          width: min(94%, 900px);

          display: grid;
          grid-template-columns: repeat(4, 1fr);

          gap: clamp(7px, 1vw, 14px);
        }

        .site-button {
          min-height: clamp(42px, 5vh, 55px);

          border: 1px solid rgba(255,255,255,0.2);
          border-radius: 10px;

          background: rgba(0,0,0,0.72);

          color: white;

          font-family: Arial, Helvetica, sans-serif;
          font-size: clamp(13px, 1.2vw, 17px);
          font-weight: 600;

          cursor: pointer;

          transition:
            transform 0.15s ease,
            background 0.15s ease,
            border-color 0.15s ease;

          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
        }

        .site-button:hover {
          background: rgba(255,255,255,0.16);
          border-color: rgba(255,255,255,0.4);
          transform: translateY(-2px);
        }

        .site-button:active {
          transform: translateY(0);
          background: rgba(255,255,255,0.1);
        }

        @media (max-width: 600px) {
          .buttons {
            grid-template-columns: repeat(2, 1fr);
            width: 92%;
          }

          .site-button {
            min-height: 46px;
          }
        }

        @media (max-width: 320px) {
          .buttons {
            gap: 5px;
          }

          .site-button {
            font-size: 12px;
          }
        }
      ]]>
    </style>
  </defs>

  <foreignObject x="0" y="0" width="100%" height="100%">

    <xhtml:div class="page">

      <xhtml:div class="topbar">
        Cammy's web
      </xhtml:div>

      <xhtml:div class="buttons">

        <xhtml:button
          class="site-button"
          onclick="openSite('https://s3.amazonaws.com/mathvc/index.html')">
          Fern
        </xhtml:button>

        <xhtml:button
          class="site-button"
          onclick="openSite('https://s3.amazonaws.com/schoolsucks/index.html')">
          lucide
        </xhtml:button>

        <xhtml:button
          class="site-button"
          onclick="openSite('https://cdn.jsdelivr.net/gh/cherriunblocked/svg@latest/index.svg')">
          Cherri
        </xhtml:button>

        <xhtml:button
          class="site-button"
          onclick="openSite('https://s3.amazonaws.com/prageru-server/mathematics.html')">
          GN math
        </xhtml:button>

      </xhtml:div>

    </xhtml:div>

  </foreignObject>

  <script type="text/javascript">
    <![CDATA[
      function openSite(url) {

        var tab = window.open("about:blank", "_blank");

        if (!tab) {
          return;
        }

        tab.document.title = "New Tab";

        var iframe = tab.document.createElement("iframe");

        iframe.src = url;

        iframe.style.position = "fixed";
        iframe.style.top = "0";
        iframe.style.left = "0";
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "0";

        tab.document.body.style.margin = "0";
        tab.document.body.style.overflow = "hidden";

        tab.document.body.appendChild(iframe);
      }
    ]]>
  </script>

</svg>
